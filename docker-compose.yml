version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: binary-towers-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P_ss4_T0wers_Postgres_DB
